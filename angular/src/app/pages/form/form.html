<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0">New Order</h5>
      </div>
      <div class="card-body">
        @if (message()) {
          <div class="alert alert-info py-2">{{ message() }}</div>
        }

        <form (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <div class="input-group">
              <select
                class="form-select"
                [ngModel]="selectedCustomerId()"
                (ngModelChange)="onCustomerChange($event)"
                name="customer"
              >
                <option [ngValue]="null">-- Select customer --</option>
                @for (c of customers(); track c.customerId) {
                  <option [ngValue]="c.customerId">{{ c.name }}</option>
                }
              </select>
<!--              <input-->
<!--                class="form-control"-->
<!--                placeholder="Search..."-->
<!--                [ngModel]="search()"-->
<!--                (ngModelChange)="search.set($event)"-->
<!--                name="search"-->
<!--              />-->
<!--              <button class="btn btn-outline-secondary" type="button" (click)="loadCustomers()">-->
<!--                <i class="bi bi-search"></i>-->
<!--              </button>-->
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Address</label>
            <input
              class="form-control"
              [ngModel]="address()"
              (ngModelChange)="address.set($event)"
              name="address"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Location</label>
            <input
              class="form-control"
              [ngModel]="location()"
              (ngModelChange)="location.set($event)"
              name="location"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input
              class="form-control"
              [ngModel]="phone()"
              (ngModelChange)="phone.set($event)"
              name="phone"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Is Freeze</label>
            <select
              class="form-select"
              [ngModel]="freezeMode()"
              (ngModelChange)="freezeMode.set($event)"
              name="isFreeze"
            >
              <option value="ละลาย">ละลาย</option>
              <option value="แช่แข็ง">แช่แข็ง</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Delivery Mode</label>
            <select
              class="form-select"
              [ngModel]="deliveryMode()"
              (ngModelChange)="deliveryMode.set($event)"
              name="deliveryMode"
            >
              <option value="ขนส่ง">ขนส่ง</option>
              <option value="ส่งเอง">ส่งเอง</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Order Date</label>
            <input
              type="date"
              class="form-control"
              [ngModel]="orderDate()"
              (ngModelChange)="orderDate.set($event)"
              name="orderDate"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Note</label>
            <textarea
              class="form-control"
              rows="2"
              [ngModel]="note()"
              (ngModelChange)="note.set($event)"
              name="note"
            ></textarea>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label mb-0">Items</label>
              <button class="btn btn-sm btn-outline-primary" type="button" (click)="addItem()">
                <i class="bi bi-plus-lg"></i> Add Item
              </button>
            </div>
            @for (item of items(); track $index) {
              <div class="input-group mb-2">
                <input
                  class="form-control"
                  placeholder="Item name"
                  [ngModel]="item.name"
                  (ngModelChange)="updateItem($index, 'name', $event)"
                  [name]="'item-name-' + $index"
                />
                <input
                  class="form-control"
                  style="max-width: 120px"
                  placeholder="Qty"
                  [ngModel]="item.quantity"
                  (ngModelChange)="updateItem($index, 'quantity', $event)"
                  [name]="'item-qty-' + $index"
                />
                <button class="btn btn-outline-danger" type="button" (click)="removeItem($index)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            }
          </div>

          <button class="btn btn-primary w-100" type="submit" [disabled]="saving()">
            @if (saving()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            Submit Order
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
